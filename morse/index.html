<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Koch — Morse practice</title>
    <script type="module" crossorigin src="/assets/index-CoWzTS7n.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-B6i8hDwj.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Koch / Morse practice</h1>
        <div class="header-actions">
          <span class="state" id="state">ready</span
          ><button class="quiet" id="reset" title="Reset progress" aria-label="Reset progress">
            ↺
          </button>
        </div>
      </header>
      <section class="practice" aria-live="polite">
        <div class="training-switch" aria-label="Training direction">
          <button type="button" data-training="receive">Receive</button
          ><button type="button" data-training="transmit">Transmit</button>
        </div>
        <div class="controls">
          <button class="primary" id="start">Start</button>
          <div class="modes" aria-label="Receiving group size">
            <button class="mode" type="button" data-mode="char" title="Wait after one character">
              1</button
            ><button
              class="mode"
              type="button"
              data-mode="group"
              title="Wait after five characters"
            >
              5</button
            ><button
              class="mode"
              type="button"
              data-mode="text"
              title="Send the whole text continuously"
            >
              ∞
            </button>
          </div>
        </div>
        <div class="answer" id="answer"></div>
        <button class="tx-help" id="tx-help" type="button" hidden></button>
        <div class="tape" id="tape"></div>
        <div class="keyboard" id="keyboard" aria-label="Answer keyboard"></div>
      </section>
      <section>
        <div class="mastery" id="mastery" aria-label="Character accuracy"></div>
        <div class="letter-hint" id="hint" hidden></div>
      </section>
    </main>
    <script src="./jscwlib.js"></script>
  </body>
</html>
